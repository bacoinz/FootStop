name: Bug report / Reportar um bug
description: Something in the game is broken, or a name is judged wrongly. / Algo no jogo está partido, ou um nome foi mal avaliado.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! / Obrigado por reportares!
        You can write in English or Portuguese. / Podes escrever em inglês ou português.
  - type: textarea
    id: what
    attributes:
      label: What happened? / O que aconteceu?
      description: What did you do, what did you expect, and what happened instead. / O que fizeste, o que esperavas e o que aconteceu.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where in the game? / Em que parte do jogo?
      options:
        - A name was accepted or refused wrongly / Um nome foi aceite ou recusado mal
        - Home or lobby / Início ou sala
        - During a round / Durante uma ronda
        - Round end or table / Fim da ronda ou tabela
        - End of game / Fim do jogo
        - Solo mode / Modo a solo
        - Other / Outra
  - type: input
    id: name
    attributes:
      label: Name typed and round (if it's about a name) / Nome escrito e ronda (se for sobre um nome)
      placeholder: e.g. "Manu" in Letter M / ex.: «Manu» na Letra M
  - type: input
    id: device
    attributes:
      label: Device and browser / Aparelho e browser
      placeholder: e.g. Windows, Chrome 131 / ex.: iPhone, Safari
  - type: textarea
    id: images
    attributes:
      label: Screenshots (optional) / Imagens (opcional)
      description: Drag images here. / Arrasta imagens para aqui.
